<!DOCTYPE html>
<html lang="vi">
<head>

<style>
html, body {
  margin: 0;

  height: 100%;
}

body {
  background-image: url("Hanamhome.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.quote {
  position: absolute;

  color: white;

  font-size: clamp(18px, 5vw, 36px);

  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  text-align: center;

  text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);

  /* Cho phép xuống dòng trên màn hình nhỏ */
  width: 90%;
  max-width: 900px;
}
</style>

</head>

<body>

  <div class="quote">
    Tên miền này vẫn hoạt động để nhớ một thời ta đã đam mê, kết nối dưới mái nhà Hanamhome.

</html>
